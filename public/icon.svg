<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#F5F0EB"/>
  <!-- Canvas frame -->
  <rect x="4" y="6" width="24" height="20" rx="1" fill="#FAF7F3" stroke="#8B7355" stroke-width="2"/>
  <!-- Inner gradient feel -->
  <rect x="5" y="7" width="22" height="18" rx="0.5" fill="url(#g)"/>
  <!-- "O" lettermark -->
  <text x="16" y="20.5" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#3D2B1F">O</text>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F3"/>
      <stop offset="100%" stop-color="#E8DCCF"/>
    </linearGradient>
  </defs>
</svg>
